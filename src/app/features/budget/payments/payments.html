<ng-template appHeaderActions>
  <app-scope-switch [(scope)]="store.scope" />
</ng-template>

<app-payment-list
  class="card"
  title="Регулярные платежи"
  emptyText="Подписок и кредитов нет"
  addLink="add"
  [items]="store.paymentItems()"
  (settle)="settle($event)"
  (close)="close($event)"
/>

<app-payment-list
  class="card"
  title="Кредитные карты"
  emptyText="Карт нет"
  addLink="add-card"
  [items]="store.cardItems()"
  (settle)="settle($event)"
  (close)="close($event)"
/>
